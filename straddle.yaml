# acme — ACME (Let's Encrypt) TLS certificates for spangap.
#
# HTTP-01 challenge handler compiles only when spangap-web is in the graph
# (gated on CONFIG_SPANGAP_WEB); DNS-01 (via DuckDNS) is the always-on path.
# A spangap-web-less build runs DNS-01-only and will error at runtime if no
# TXT-capable provider is configured.
schema_version: 1
name: spangap/acme
prefix: acme
version: 0.0.0
firmware: esp-idf
platforms: [idf]
requires:
  - spangap/spangap-net
# Integration deps are NOT declared here — the build reads them from the code:
# acme.cpp's HTTP-01 handler is `#if CONFIG_SPANGAP_WEB` (→ spangap-web added to
# REQUIRES when web is staged), and the conditional/spangap-lcd/ slice implies
# spangap-lcd. A web-less build runs DNS-01-only; both compile away when absent.
# Auto-init: AcmeService::onInit is run by the generated boot dispatcher. Runs
# in the straddle band, after the platform band — so the net foundation it needs
# (TLS/NTP for cert validity) and the optional spangap-web HTTP-01 handler are
# already up. requires: spangap-net keeps that guarantee explicit.
services:
  - { class: AcmeService, header: acme.h }

# Declarative settings: both surfaces + the storage defaults generated from this
# block. Method: empty = auto (DNS-01 if a TXT provider exists, else HTTP-01).
# HTTP-01 is listed even on a web-less build, where picking it errors at
# runtime — the same behaviour either way.
settings:
  - at:
      - { id: net }
      - { id: acme, label: "ACME", short: "ACME" }
    rows:
      - section: "ACME"
      - switch: { label: "Enable ACME (Let's Encrypt)", key: "s.acme.enable", default: 0 }
      - text:   { label: "Domain (FQDN)", key: "s.net.dns.fqdn" }
      - dropdown:
          label: "Challenge method"
          key: "s.acme.method"
          default: ""
          options:
            - { v: "",        l: "Auto" }
            - { v: "DNS-01",  l: "DNS-01" }
            - { v: "HTTP-01", l: "HTTP-01" }
      - caption: "Auto uses DNS-01 when a TXT API is available, otherwise HTTP-01."
      # acme.cpp turns duckdns's dns.txtrecord.capable flag into the word to
      # show, so neither UI has to know what the flag means.
      - value:  { label: "DNS TXT API", key: "acme.dns_txt" }
      - text:   { label: "Account URL", key: "s.acme.url", default: "" }
      - caption: "The account URL appears after the first successful run; leave it blank on a fresh device."
