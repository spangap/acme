# acme — ACME (Let's Encrypt) TLS certificates for spangap.
#
# HTTP-01 challenge handler compiles only when spangap-web is in the graph
# (gated on CONFIG_SPANGAP_WEB); DNS-01 (via DuckDNS) is the always-on path.
# A spangap-web-less build runs DNS-01-only and will error at runtime if no
# TXT-capable provider is configured.
schema_version: 1
name: spangap/acme
prefix: acme
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
optional_requires:
  # HTTP-01 challenge handler — call sites in acme.cpp gated on
  # CONFIG_SPANGAP_WEB. Drop with --no-web; DNS-01 path keeps working.
  - spangap/spangap-web
  # On-device Settings pane via lcdSetting* helpers — gated on CONFIG_SPANGAP_LCD.
  - spangap/spangap-lcd
# Auto-init: folded into the generated spangapInitStraddles() dispatcher. Runs
# in the straddle band, after the platform band — so the net foundation it needs
# (TLS/NTP for cert validity) and the optional spangap-web HTTP-01 handler are
# already up. requires: spangap-net keeps that guarantee explicit.
init:
  - call: acmeInit
